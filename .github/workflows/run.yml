          <title>27</title>
          <style>
          :root{--bg:#0b1020;--card:#151c33;--line:#26304f;--tx:#e8ecf8;--mu:#8a96b8;--ac:#4f8cff;--ok:#2fbf71;--wa:#e6a23c;--er:#e5534b}
          *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Tahoma,sans-serif;padding-bottom:76px}
          header{padding:18px 16px 6px;display:flex;align-items:center;gap:10px}
